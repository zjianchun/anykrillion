      <stop offset="0%" stop-color="#07223e"/>
      <stop offset="100%" stop-color="#020b16"/>
    </linearGradient>
    <linearGradient id="ak-border" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
